# Hugo configuration file
title: "SBTL"

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

enableGitInfo: true

# While using `lastmod: 2026-03-13` metadata in .md files
# frontmatter:
#   lastmod:
#     - lastmod
#     - :git
#     - date
#     - publishDate

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Stacks
      pageRef: /stacks
      weight: 2
    - name: About Me
      pageRef: /cv
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/sboistel"
      params:
        icon: github
    - name: LinkedIn
      weight: 6
      url: "https://www.linkedin.com/in/boistel-sam"
      params:
        icon: linkedin

  # sidebar:
  #   - identifier: more
  #     name: More
  #     params:
  #       type: separator
  #     weight: 1
  #   - identifier: about
  #     name: "About"
  #     pageRef: "/about"
  #     weight: 2

params:
  author: 
    name: "sboistel"
  description: "Sam's Portfolio"
  externalLinkDecoration: true
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # Options de flexsearch
      index: content
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/sb_logo.png
      dark: images/sb_logo.png
      width: 40
      height: 20
      link: /
    width: wide

    theme:
      default: system # light | dark | system
      displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover # hover | always

  editURL:
    enable: true
    base: "https://github.com/sboistel/docki/edit/gohugo/content"
