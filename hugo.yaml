# Hugo configuration file
title: Sam's Portfolio

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

enableGitInfo: true

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About Me
      pageRef: /cv
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/sboistel"
      params:
        icon: github

  # sidebar:
  #   - identifier: more
  #     name: More
  #     params:
  #       type: separator
  #     weight: 1
  #   - identifier: about
  #     name: "About"
  #     pageRef: "/about"
  #     weight: 2

params:
  description: "Sam's Portfolio"
  externalLinkDecoration: true
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/sb_logo.png
      dark: images/sb_logo.png
      width: 40
      height: 20
      link: /
    width: wide
  
    theme:
      # light | dark | system
      default: system
      displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  editURL:
    enable: true
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
